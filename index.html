
<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Adaptación a celulares y computadoras -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Título SEO -->
    <title>Vértice Web | Diseño Web y Desarrollo de Software en Costa Rica</title>

    <!-- Descripción para Google -->
    <meta
      name="description"
      content="En Vértice Web creamos páginas web, aplicaciones y soluciones digitales para negocios y emprendedores en Costa Rica. Diseño moderno, adaptable y personalizado."
    />

    <!-- Indexación en buscadores -->
    <meta name="robots" content="index, follow" />

    <!-- Color del navegador -->
    <meta name="theme-color" content="#080d18" />

    <!-- Favicon de Vértice Web -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <!-- Open Graph: WhatsApp y Facebook -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="es_CR"
    />

    <meta
      property="og:site_name"
      content="Vértice Web"
    />

    <meta
      property="og:title"
      content="Vértice Web | Diseño y Desarrollo Digital"
    />

    <meta
      property="og:description"
      content="Diseñamos páginas web, aplicaciones y soluciones digitales modernas para impulsar tu negocio. Tu idea, nuestra experiencia."
    />

    <!-- Imagen para compartir -->
    <meta
      property="og:image"
      content="https://vertizeweb.pages.dev/vertice-compartir.png"
    />

    <meta
      property="og:image:alt"
      content="Vértice Web: diseño web, aplicaciones y soluciones digitales"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="Vértice Web | Diseño y Desarrollo Digital"
    />

    <meta
      name="twitter:description"
      content="Diseño web, aplicaciones y soluciones digitales para impulsar tu negocio en Costa Rica."
    />

    <meta
      name="twitter:image"
      content="https://vertizeweb.pages.dev/vertice-compartir.png"
    />
  </head>

  <body>
    <div id="app"></div>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
